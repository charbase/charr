url: https://charbase.github.io/charr/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    font-size-base: "0.9rem"

# The funder holds the fnd role, which pkgdown would otherwise print in the
# "Developed by" footer alongside the author. The authors page credits everyone.
authors:
  footer:
    roles: [aut, cre]

navbar:
  structure:
    left: [under_the_hood, code_map, reference]
    right: [search, github, lightswitch]
  components:
    under_the_hood:
      text: "Under the hood"
      href: articles/under-the-hood.html
    # Generated by `make code-map` into pkgdown/assets/code-map, which pkgdown
    # copies verbatim into docs/. It is a standalone viewer, not a pkgdown page.
    code_map:
      text: "Code map"
      href: code-map/index.html

articles:
- title: Start Here
  navbar: ~
  contents:
  - charr
- title: Under the hood
  contents:
  - under-the-hood

reference:
