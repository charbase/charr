# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.backend }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # R-devel everywhere: R's ALTREP API is documented as "experimental,
          # may change on short notice", so CI against R-devel is mandatory.
          - {os: macOS-latest,   r: 'devel',   backend: 'altrep', http-user-agent: 'release'}
          - {os: windows-latest, r: 'devel',   backend: 'altrep', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   backend: 'altrep', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1', backend: 'altrep'}
          - {os: ubuntu-latest,  r: 'oldrel-2', backend: 'altrep'}
          - {os: ubuntu-latest,  r: 'oldrel-3', backend: 'altrep'}
          - {os: ubuntu-latest,  r: 'oldrel-4', backend: 'altrep'}
          # Exercise all three routes on release R for every supported OS.
          - {os: macOS-latest,   r: 'release', backend: 'stringi'}
          - {os: macOS-latest,   r: 'release', backend: 'base'}
          - {os: macOS-latest,   r: 'release', backend: 'altrep'}
          - {os: windows-latest, r: 'release', backend: 'stringi'}
          - {os: windows-latest, r: 'release', backend: 'base'}
          - {os: windows-latest, r: 'release', backend: 'altrep'}
          - {os: ubuntu-latest,  r: 'release', backend: 'stringi'}
          - {os: ubuntu-latest,  r: 'release', backend: 'base'}
          - {os: ubuntu-latest,  r: 'release', backend: 'altrep'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CHARR_BACKEND: ${{ matrix.config.backend }}

    steps:
      - name: Windows CRLF fix
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          upload-snapshots: true
