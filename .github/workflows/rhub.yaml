# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
#
# This copy is modified and `rhub::rhub_setup()` must not overwrite it:
#
#   * the r-hub actions are pinned by commit SHA rather than the mutable v1 tag;
#   * `config` defaults to every platform r-hub offers, not the three-platform
#     upstream default;
#   * charport is installed from its GitHub default branch rather than CRAN,
#     as in R-CMD-check.yaml (`extra-packages` in both setup-deps steps, and a
#     GITHUB_PAT for the GitHub API).
#   * each Linux container has its own R_LIBS_USER, and so its own package
#     cache (see the linux-containers job);
#   * the Linux containers check charr at -O2, as CRAN does, rather than the
#     -O3 their Makevars sets (see the "Compile at -O2" step).
#
# The pinned SHA resolves the platform names, so the pin and the list below are
# two halves of one fact and are updated together by `make rhub-platforms`.
#
# Trigger this from the Actions tab with the "Run workflow" button. It is
# deliberately not run on push: a full sweep is tens of jobs, several of them
# instrumented builds that take hours.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: 'ubuntu-clang,ubuntu-gcc12,ubuntu-next,ubuntu-release,atlas,c23,clang-asan,clang-ubsan,clang16,clang17,clang18,clang19,clang20,clang21,clang22,gcc13,gcc14,gcc15,gcc16,gcc-asan,lto,nold,noremap,valgrind,mkl,intel,donttest,nosuggests,rchk,vnu,windows,macos,macos-arm64,linux,m1-san' # rhub-platforms
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

# The vignettes require Quarto, which R-hub does not install. Skip them.
env:
  BUILD_ARGS: --no-build-vignettes
  CHECK_ARGS: --ignore-vignettes
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    # setup-deps caches R_LIBS_USER under a key built from the OS release, the
    # R version and the R-hub repository, so containers that differ only in
    # compiler restore each other's builds (an Intel-built charport needing
    # libsvml.so, a digest linked against libc++). actions/cache only restores
    # an entry saved from the same paths, so a library path per platform keeps
    # the caches apart.
    env:
      R_LIBS_USER: /github/home/R/rhub-${{ matrix.config.label }}

    steps:
      - uses: r-hub/actions/checkout@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
      - uses: r-hub/actions/platform-info@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
          extra-packages: any::rcmdcheck, github::charbase/charport
      # The compiler containers point R_MAKEVARS_USER at a Makevars that builds
      # with -O3, which CRAN's checks do not use. At -O3, GCC 13-15 report
      # false positives (-Warray-bounds in charport's headers,
      # -Wstringop-overflow in ICU's decNumber) that R CMD check counts as
      # warnings. Check at -O2 and leave the Makevars' other flags alone.
      - name: Compile at -O2
        run: |
          if [ -f "${R_MAKEVARS_USER:-}" ]; then
            sed -i 's/-O3\b/-O2/g' "$R_MAKEVARS_USER"
            cat "$R_MAKEVARS_USER"
          fi
      - uses: r-hub/actions/run-check@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
      - uses: r-hub/actions/setup-r@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
          extra-packages: any::rcmdcheck, github::charbase/charport
      - uses: r-hub/actions/run-check@cf6c8eff3145ef225104294e6b0c023de4bba9c6 # v1.7.7
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
